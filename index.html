<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Weather 2.0</title>
   <link rel="stylesheet" href="./style.css" type="text/css">
   <script src="./script.js" defer></script>
</head>

<body>
   <header>
      <h1 id="title">Weather Central 2.0</h1>
   </header>

   <main>
      <section id="search-section" >
         <form id="weather-form" action="" method="post">
            <label for="city-search">City Search:</label>
            <input type="text" name="city-search" id="city-search">
            <button id="search-button">Submit</button>
         </form>
      </section>

      <section id="weather-output">
         <h2>Weather Results</h2>
         <p id="weather-data"></p>
         <br>
         <p id="weather-data-2"></p>
         <br>
         <object data="" type="image/svg+xml" id="animation-img"></object>
      </section>

   </main>

   <footer>
      <h3>Weather Central brought to you by <span id="my-name">S3R610N</span> Solutions.</h3>
   </footer>
   
</body>

</html>
